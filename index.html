<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>牆泥車況</title>
<!--
  牆泥車機：手機看車況和報表。單一檔案、沒有秘密金鑰：預設連車主的 Supabase 專案（公開的網址和 publishable key），用車主帳號登入。
  資料表見 supabase/schema.sql；每張表都有 Row Level Security，沒登入什麼都讀不到。
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#16181d; --dim:#6b7280; --line:#e5e7eb; --accent:#2563eb; --good:#16a34a; --warn:#d97706; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#1a1d23; --text:#e8eaed; --dim:#9aa3ad; --line:#2a2f37; --accent:#60a5fa; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  header { padding: calc(14px + env(safe-area-inset-top)) 16px 6px; display:flex; align-items:baseline; justify-content:space-between; }
  header h1 { margin:0; font-size:22px; }
  header small { color:var(--dim); }
  main { padding: 0 16px; max-width: 720px; margin: 0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin:12px 0; border:1px solid var(--line); }
  .card h2 { margin:0 0 8px; font-size:17px; }
  .big { font-size:52px; font-weight:700; line-height:1.1; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .dim { color:var(--dim); font-size:14px; }
  .grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--dim); font-size:13px; }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .map { height:260px; border-radius:10px; margin-top:8px; }
  .item { padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
  .item:first-child { border-top:none; }
  .item .t { font-weight:600; }
  input, button, select { font:inherit; }
  input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin:4px 0 10px; }
  button { padding:10px 14px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:600; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; color:var(--dim); border-radius:0; padding:12px 0; font-weight:500; }
  nav button.on { color:var(--accent); font-weight:700; }
  .hidden { display:none !important; }
  .pv { position:relative; width:100%; aspect-ratio:1920/800; background:linear-gradient(160deg,#3a3358,#1c1a2b); border-radius:14px; overflow:hidden; color:#f2f4f7; container-type:inline-size; }
  .pvcard { position:absolute; background:#111317; border:1px solid #ffffff30; border-radius:2.2cqw; padding:1.2cqw 1.6cqw; box-sizing:border-box; overflow:hidden; display:flex; flex-direction:column; justify-content:space-around; }
  .pvL { left:0.3%; top:12.5%; width:38.3%; height:84%; }
  .pvR { left:66.7%; top:12.5%; width:23.4%; height:84%; justify-content:flex-start; gap:1cqw; }
  .pvT { left:39.6%; top:3%; width:20.8%; height:13.8%; flex-direction:row; padding:0.5cqw 1cqw; }
  .pvhead { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ffffff30; padding-bottom:0.8cqw; }
  .pvdef { font-size:1.2cqw; font-weight:400; color:#fbbf24; border:1px solid #fbbf2466; border-radius:0.6cqw; padding:0 0.6cqw; margin-left:0.6cqw; }
  .pvtitle { color:#9aa3ad; font-weight:700; font-size:2.6cqw; }
  .pvgear { background:#f2f4f7; color:#111; font-weight:900; font-size:2.6cqw; padding:0 1.2cqw; border-radius:0.8cqw; }
  .pvrow { display:flex; justify-content:space-between; align-items:baseline; gap:1cqw; white-space:nowrap; }
  .pvcol { flex:1; display:flex; flex-direction:column; white-space:nowrap; overflow:hidden; }
  .pvcol .pvv { font-size:2.2cqw; } .pvcol .pvl { font-size:1.1cqw; }
  .pvl { color:#9aa3ad; font-size:2cqw; } .pvv { font-size:2.6cqw; } .pvu { color:#c8ced4; font-size:1.4cqw; }
  .pvmid { position:absolute; left:40%; width:26%; top:18%; bottom:4%; display:flex; flex-direction:column; align-items:center; color:#ffffffcc; }
  .pvspeed { font-size:6cqw; font-weight:300; line-height:1; } .pvspeed small { font-size:1.4cqw; }
  .pvready { color:#3ddc84; font-size:1.4cqw; }
  .pvlane { flex:1; width:60%; margin-top:1cqw; background:linear-gradient(90deg,transparent 18%,#3ddc8466 19%,transparent 21%,transparent 79%,#3ddc8466 80%,transparent 82%); }
  .pvnote { font-size:1.1cqw; color:#ffffff80; }
  .pvnav { display:flex; gap:1.2cqw; align-items:center; }
  .pvarrow { background:#2e9e4f; border-radius:1cqw; width:7cqw; height:7cqw; display:flex; align-items:center; justify-content:center; font-size:5cqw; font-weight:900; flex:none; }
  .pvdist { font-size:3.4cqw; } .pvins { font-size:1.5cqw; } .pvleft { font-size:1.6cqw; color:#c8ced4; font-weight:700; }
  .pvbar { height:0.6cqw; background:#ffffff22; border-radius:1cqw; } .pvbar i { display:block; width:34%; height:100%; background:#4aa8ff; border-radius:1cqw; }
  .pvtab { width:auto; padding:6px 14px; }
  .pvtab.pvoff { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  main.wide { max-width: 1400px; }
  .clgrid { display:grid; grid-template-columns: minmax(0,1fr); gap:0 16px; }
  .clpal { position:sticky; top:0; z-index:5; }
  @media (min-width: 760px) {
    .clgrid { grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); align-items:start; }
    .clpv { position:sticky; top:0; }
    .clpal { position:static; }
  }
  .clbox { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:6px; border:1px dashed var(--line); border-radius:10px; }
  .clchip { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:99px; background:var(--bg); border:1px solid var(--line); font-size:15px; touch-action:none; user-select:none; }
  #clPalette .clx { display:none; }
  .clx { font-weight:400; color:var(--dim); cursor:pointer; padding:0 2px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:13px; background:var(--bg); border:1px solid var(--line); }
  canvas { max-width:100%; }
  details summary { cursor:pointer; color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<header><h1>牆泥車況</h1><small id="updated"></small></header>
<main>

<!-- first visit: project address, then login -->
<section id="setup" class="hidden">
  <div class="card">
    <h2>第一次設定</h2>
    <p class="dim">Supabase 專案 → Project Settings → API。這兩個只存在這支手機，不會放在網頁檔案裡。</p>
    <label>專案網址</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" autocapitalize="off">
    <label>anon public key</label><input id="sbAnon" autocapitalize="off">
    <button onclick="saveSetup()">下一步</button>
  </div>
</section>

<section id="login" class="hidden">
  <div class="card">
    <h2>登入</h2>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>密碼</label><input id="password" type="password" autocomplete="current-password">
    <button onclick="login()">登入</button> <span id="loginMsg" class="bad"></span>
    <p><button class="ghost" onclick="resetSetup()">改專案網址</button></p>
  </div>
</section>

<section id="tab-now" class="tab hidden"></section>
<section id="tab-trips" class="tab hidden"></section>
<section id="tab-charges" class="tab hidden"></section>
<section id="tab-reports" class="tab hidden"></section>
<section id="tab-key" class="tab hidden"></section>
<section id="tab-cluster" class="tab hidden"></section>
<section id="tab-settings" class="tab hidden"></section>
</main>

<nav id="nav" class="hidden">
  <button data-tab="now" class="on">車況</button>
  <button data-tab="trips">旅程</button>
  <button data-tab="charges">充電</button>
  <button data-tab="reports">報表</button>
  <button data-tab="key">鑰匙</button>
  <button data-tab="cluster">儀表</button>
  <button data-tab="settings">設定</button>
</nav>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? "--" : Number(v).toFixed(d);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dt = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const dur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m} 分`; };
const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); if (m < 1) return "剛剛"; if (m < 60) return `${m} 分鐘前`; if (m < 1440) return `${Math.round(m / 60)} 小時前`; return `${Math.round(m / 1440)} 天前`; };

const DEFAULT_URL = "https://mmmhhgnmopvdjzspdkfb.supabase.co";
const DEFAULT_KEY = "sb_publishable_6awiskZ188ou0bd62h_28A_JEP1_Vci";
let sb = null, prefs = null, charts = [], maps = [];
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function show(id) { for (const s of ["setup", "login"]) $(s).classList.toggle("hidden", s !== id); }

async function boot() {
  // 預設：車主的 Supabase 專案（網址和 publishable key 本來就公開；資料靠登入＋RLS 保護）
  const url = store.get("qn_url") || DEFAULT_URL, anon = store.get("qn_anon") || DEFAULT_KEY;
  if (!url || !anon) { show("setup"); return; }
  sb = supabase.createClient(url, anon, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  if (!data.session) { show("login"); return; }
  show(null);
  $("nav").classList.remove("hidden");
  await loadPrefs();
  openTab(store.get("qn_tab") || "now");
}
function saveSetup() {
  const url = $("sbUrl").value.trim().replace(/\/$/, ""), anon = $("sbAnon").value.trim();
  if (!/^https:\/\/.+/.test(url) || anon.length < 20) { alert("網址或 key 不對"); return; }
  store.set("qn_url", url); store.set("qn_anon", anon); boot();
}
function resetSetup() { store.set("qn_url", ""); store.set("qn_anon", ""); show("setup"); }
async function login() {
  $("loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) { $("loginMsg").textContent = "登入失敗：" + error.message; return; }
  boot();
}

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => openTab(b.dataset.tab));
function openTab(t) {
  store.set("qn_tab", t);
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".tab").forEach((s) => s.classList.toggle("hidden", s.id !== "tab-" + t));
  charts.forEach((c) => c.destroy()); charts = [];
  maps.forEach((m) => m.remove()); maps = [];
  if (t !== "cluster") document.querySelector("main").classList.remove("wide");
  ({ now: renderNow, trips: renderTrips, charges: renderCharges, reports: renderReports, key: renderKey, cluster: renderCluster, settings: renderSettings })[t]();
}

// ------------------------------------------------------------ data helpers

async function q(table, build, cols = "*") {
  let r = sb.from(table).select(cols);
  if (build) r = build(r);
  const { data, error } = await r;
  if (error) throw new Error(`${table}：${error.message}`);
  return data;
}
/** Everything matching, 1000 rows a page (Supabase's page limit), up to [max]. */
async function all(table, build, cols, max = 20000) {
  const out = [];
  for (let from = 0; from < max; from += 1000) {
    const page = await q(table, (r) => build(r).range(from, from + 999), cols);
    out.push(...page);
    if (page.length < 1000) break;
  }
  return out;
}
async function loadPrefs() {
  const rows = await q("prefs").catch(() => []);
  prefs = Object.assign({ home_price: 2.0, public_price: 9.0, home_lat: null, home_lon: null, home_radius_m: 150, charge_target: 80,
    tou_enabled: false, tou_plan: null, offpeak_start: "22:30", offpeak_end: "07:30", weekend_offpeak: true, home_peak_price: 5.0,
    service_every_km: 0, service_base_km: null }, rows[0] || {});
  if (!prefs.tou_plan) prefs.tou_plan = rows[0] ? (prefs.tou_enabled ? "custom" : "none") : "simple2"; // 車主家是二段式
}
/**
 * Taipower 住商型簡易時間電價 (from 2025-10-01; 夏月 6/1–9/30; weekends all off-peak; national holidays are off-peak at
 * Taipower but not known here). Same hours as the car (Rules.kt). Prices per kWh, 元; check against your bill.
 */
const TOU = {
  simple2: { name: "簡易型二段式", summer: { PEAK: 5.16, OFF: 2.06 }, winter: { PEAK: 4.93, OFF: 1.99 } },
  simple3: { name: "簡易型三段式", summer: { PEAK: 7.13, HALF: 4.69, OFF: 2.06 }, winter: { HALF: 4.48, OFF: 1.99 } },
};
function hm(t) { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? (Number(m[1]) * 60 + Number(m[2])) % 1440 : null; }
function period(ms) {
  const plan = prefs.tou_plan, d = new Date(ms), dow = d.getDay(), min = d.getHours() * 60 + d.getMinutes(), summer = d.getMonth() >= 5 && d.getMonth() <= 8;
  if (plan === "custom") {
    const a = hm(prefs.offpeak_start), b = hm(prefs.offpeak_end);
    if (a === null || b === null || (prefs.weekend_offpeak && (dow === 0 || dow === 6))) return "OFF";
    return (a <= b ? (min >= a && min < b) : (min >= a || min < b)) ? "OFF" : "PEAK";
  }
  if (!TOU[plan] || dow === 0 || dow === 6) return "OFF";
  if (plan === "simple2") return summer ? (min < 540 ? "OFF" : "PEAK") : (min < 360 || (min >= 660 && min < 840) ? "OFF" : "PEAK");
  if (summer) return min < 540 ? "OFF" : (min >= 960 && min < 1320) ? "PEAK" : "HALF";
  return min < 360 || (min >= 660 && min < 840) ? "OFF" : "HALF";
}
const PERIOD_NAME = { OFF: "離峰", HALF: "半尖峰", PEAK: "尖峰" };
const isPeak = (ms) => period(ms) !== "OFF";
/** Home price per kWh at a moment: the Taipower table, or the owner's own two prices for "custom"/"none". */
function homePrice(ms) {
  const t = TOU[prefs.tou_plan];
  if (t) { const m = new Date(ms).getMonth(); return (m >= 5 && m <= 8 ? t.summer : t.winter)[period(ms)]; }
  return isPeak(ms) ? prefs.home_peak_price : prefs.home_price;
}
function metres(aLat, aLon, bLat, bLon) {
  const r = 6371000, k = Math.PI / 180;
  const x = (bLon - aLon) * k * Math.cos((aLat + bLat) / 2 * k), y = (bLat - aLat) * k;
  return Math.sqrt(x * x + y * y) * r;
}
function mapIn(el, lat, lon, zoom = 15) {
  const m = L.map(el, { attributionControl: true }).setView([lat, lon], zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
  maps.push(m);
  return m;
}
function chart(el, cfg) { const c = new Chart(el, cfg); charts.push(c); return c; }
function fail(sec, e) { $(sec).innerHTML = `<div class="card"><h2>讀不到資料</h2><p class="bad">${esc(e.message)}</p><p class="dim">如果是 401／JWT：到「設定」登出再登入。</p></div>`; }

/** Trip numbers used everywhere. */
function tripInfo(t) {
  const km = t.distance_m / 1000, net = t.kwh_used - t.kwh_regen;
  // this car sends 0 for the power value: no kWh at all → show the battery % used instead of "0 Wh/km"
  const noPower = !(t.kwh_used > 0) && !(t.kwh_regen > 0);
  const whkm = km >= 1 && !noPower ? net * 1000 / km : null;
  const regenPct = t.kwh_used > 0 ? t.kwh_regen / t.kwh_used * 100 : null;
  const socUsed = t.soc_start != null && t.soc_end != null ? Math.max(0, t.soc_start - t.soc_end) : null;
  const soc100 = socUsed !== null && km >= 3 ? socUsed / km * 100 : null;
  const avg = t.moving_s > 0 ? km / (t.moving_s / 3600) : null;
  const use = whkm !== null ? `${fmt(whkm)} Wh/km` : socUsed !== null ? `用電 ${fmt(socUsed, 1)}%${soc100 !== null ? `（每 100 km ${fmt(soc100)}%）` : ""}` : "用電 --";
  return { km, net, whkm, regenPct, avg, socUsed, soc100, use, score: score(t, km, whkm, regenPct) };
}
/**
 * 駕駛評分 0–100: start at 100; hard accelerations / brakings per 10 km cost 8 each (max 40);
 * consumption above 180 Wh/km costs 1 per 4 Wh/km (max 30); regen gives up to +10. Short trips (< 2 km) get no score.
 */
function score(t, km, whkm, regenPct) {
  if (km < 2) return null;
  let s = 100;
  s -= Math.min(40, ((t.hard_accel || 0) + (t.hard_brake || 0)) / km * 10 * 8);
  if (whkm !== null && whkm > 180) s -= Math.min(30, (whkm - 180) / 4);
  if (regenPct !== null) s += Math.min(10, regenPct / 3);
  return Math.max(0, Math.min(100, Math.round(s)));
}
const scoreClass = (s) => s === null ? "" : s >= 80 ? "good" : s >= 60 ? "warn" : "bad";

/** Where a charge happened: the last GPS point before it started → home or not, and its price. */
async function chargePlaces(charges) {
  const out = new Map();
  for (const c of charges) {
    const p = await q("points", (r) => r.eq("device", c.device).lte("t", c.start_at).order("t", { ascending: false }).limit(1), "lat,lon").catch(() => []);
    const pt = p[0];
    const home = pt && prefs.home_lat !== null && metres(pt.lat, pt.lon, prefs.home_lat, prefs.home_lon) <= prefs.home_radius_m;
    let price = home ? homePrice(c.start_at) : prefs.public_price;
    if (home && prefs.tou_plan !== "none") {
      // energy-weighted over the charging curve, so a charge that runs from peak into off-peak is priced right
      const smp = await q("charge_samples", (r) => r.eq("device", c.device).eq("charge_id", c.car_id).order("t"), "t,kw").catch(() => []);
      let e = 0, money = 0;
      for (let i = 0; i + 1 < smp.length; i++) { const k = smp[i].kw * (smp[i + 1].t - smp[i].t) / 3600000; e += k; money += k * homePrice(smp[i].t); }
      if (e > 0.5) price = money / e;
    }
    out.set(`${c.device}/${c.car_id}`, { pt, home, peak: home && isPeak(c.start_at), price });
  }
  return out;
}

// ------------------------------------------------------------ 車況

async function renderNow() {
  const sec = "tab-now";
  $(sec).innerHTML = `<div class="card dim">讀取中…</div>`;
  try {
    const [st] = await q("car_status");
    const parks = await q("parks", (r) => r.order("end_at", { ascending: false }).limit(1));
    const [last] = await q("trips", (r) => r.eq("open", false).order("end_at", { ascending: false }).limit(1));
    if (!st) { $(sec).innerHTML = `<div class="card"><h2>還沒有資料</h2><p class="dim">車上的牆泥行車紀錄設定好雲端（車機工具選單 15），有網路後一分鐘內會出現。</p></div>`; return; }
    $("updated").textContent = "更新：" + ago(new Date(st.updated_at).getTime());
    let h = `<div class="card"><div class="dim">電量</div><div class="big">${fmt(st.soc)}<small style="font-size:24px">%</small></div>
      <div class="grid" style="margin-top:10px">
        <div class="stat"><b>${fmt(st.range_km)} km</b><span>原廠續航</span></div>
        <div class="stat"><b>${st.charging ? '<span class="good">充電中</span>' : st.plugged ? "插著槍" : st.parked ? "停車" : "行駛中"}</b><span>狀態</span></div>
        <div class="stat"><b>${fmt(st.outside_c)}°C</b><span>車外溫度</span></div>
        <div class="stat"><b>${st.car_time ? dt(st.car_time) : "--"}</b><span>車上最後回報</span></div>
      </div></div>`;
    h += vehicleCard(st);
    if (st.charging) h += await chargingCard(st);
    if (st.lat) h += `<div class="card"><h2>車在這裡</h2><div id="nowMap" class="map"></div>
      <p><a href="https://maps.google.com/?q=${st.lat},${st.lon}">用 Google 地圖開</a>　<a href="https://maps.apple.com/?q=${st.lat},${st.lon}">用 Apple 地圖開</a></p></div>`;
    const p = parks[0];
    if (p && p.soc_start !== null && p.soc_end !== null) {
      const hrs = (p.end_at - p.start_at) / 3600000, drop = p.soc_start - p.soc_end;
      h += `<div class="card"><h2>上次停車</h2><div class="row"><span>${dt(p.start_at)} → ${dt(p.end_at)}</span><span>${fmt(hrs, 1)} 小時</span></div>
        <div class="row"><span>${drop < -0.5 ? "期間有充電" : "掉了 " + fmt(drop, 1) + "%"}</span><span>${drop >= 0 && hrs >= 1 ? "每小時 " + fmt(drop / hrs, 2) + "%" : ""}</span></div></div>`;
    }
    if (last) {
      const i = tripInfo(last);
      h += `<div class="card"><h2>上一趟</h2><div class="row"><span>${dt(last.start_at)}　${fmt(i.km, 1)} km</span><span>${i.use}</span></div></div>`;
    }
    $(sec).innerHTML = h;
    if (st.lat) L.marker([st.lat, st.lon]).addTo(mapIn("nowMap", st.lat, st.lon, 16));
  } catch (e) { fail(sec, e); }
}

/** 車況 from 牆泥車況讀取 (bridge): odometer, tyres, 12 V, doors/windows, warning lamps. */
function vehicleCard(st) {
  const v = st.vehicle;
  if (!v) return `<div class="card"><h2>車況</h2><p class="dim">還沒有車況資料（總里程、胎壓、12V、車門）。要在車上裝「牆泥車況讀取」，打開後按「允許 USB 偵錯」，車子有網路後才會出現。</p></div>`;
  const tyre = (n, label) => v[`tire${n}Psi`] == null ? `<div class="stat"><b>--</b><span>${label}</span></div>`
    : `<div class="stat"><b class="${v[`tire${n}Warn`] ? "bad" : ""}">${fmt(v[`tire${n}Psi`], 1)}</b><span>${label} psi${v[`tire${n}C`] != null ? `・${v[`tire${n}C`]}°C` : ""}</span></div>`;
  const warn = [v.doorOpen && "車門沒關", v.windowOpen && "車窗沒關", v.tireWarn && "胎壓警示", v.warnLamp && "故障燈亮", v.hvbHot && "電池過熱"].filter(Boolean);
  return `<div class="card"><h2>車況</h2>
    ${warn.length ? `<p class="bad"><b>⚠ ${warn.join("、")}</b></p>` : `<p class="good">車門、車窗都關好，沒有警示燈</p>`}
    <div class="grid">
      <div class="stat"><b>${fmt(v.odoKm)} km</b><span>總里程</span></div>
      ${v.lvRestVolt == null ? "" : `<div class="stat"><b class="${v.lvRestVolt == null ? "" : v.lvRestVolt >= 12.4 ? "good" : v.lvRestVolt >= 12.2 ? "warn" : "bad"}">${fmt(v.lvRestVolt, 2)} V</b><span>小電瓶靜置電壓${v.lvRestVolt == null ? "（車機醒來時量）" : v.lvRestVolt >= 12.6 ? "・健康" : v.lvRestVolt >= 12.4 ? "・正常" : v.lvRestVolt >= 12.2 ? "・偏弱" : "・偏低，要檢查"}${v.lvRestAt ? "・" + dt(v.lvRestAt) : ""}</span></div>`}
      <div class="stat"><b>${fmt(v.lvVolt, 1)} V</b><span>12V 現在${v.lvVolt == null ? "" : v.lvVolt >= 13.2 ? "（大電池正在充它，車機醒著時一直會充）" : "（沒在充）"}</span></div>
      <div class="stat"><b>${v.chargeLimit != null ? v.chargeLimit + "%" : "--"}</b><span>充電上限</span></div>
      ${tyre("FL", "左前")}${tyre("FR", "右前")}${tyre("RL", "左後")}${tyre("RR", "右後")}
      ${v.chargeLeftMin != null && st.charging ? `<div class="stat"><b>${v.chargeLeftMin} 分</b><span>車子估計充滿</span></div>` : ""}
    </div></div>`;
}

/**
 * Live charging: power, energy, money so far, and time to the target / 100 % estimated from this car's own
 * earlier charges (average kW per 5 % band, fast and slow charging kept apart); falls back to the current kW.
 */
async function chargingCard(st) {
  const kw = st.charge_kw || 0, fast = kw >= 20;
  const recent = await q("charges", (r) => r.eq("open", false).order("start_at", { ascending: false }).limit(40)).catch(() => []);
  const caps = recent.filter((c) => c.soc_end - c.soc_start >= 20).map((c) => c.kwh_in / ((c.soc_end - c.soc_start) / 100));
  const cap = caps.length ? caps.slice(0, 5).reduce((a, b) => a + b, 0) / Math.min(5, caps.length) : 75;
  const same = recent.filter((c) => (c.max_kw >= 20) === fast).slice(0, 10);
  const bands = {};
  for (const c of same) {
    const smp = await q("charge_samples", (r) => r.eq("device", c.device).eq("charge_id", c.car_id), "kw,soc").catch(() => []);
    for (const x of smp) if (x.soc !== null && x.kw > 0.5) { const b = Math.floor(x.soc / 5); (bands[b] ||= []).push(x.kw); }
  }
  const bandKw = (b) => { const v = bands[b]; return v && v.length >= 3 ? v.reduce((a, c) => a + c, 0) / v.length : kw; };
  const minutesTo = (target) => {
    if (st.soc === null || st.soc >= target || kw <= 0.5) return null;
    let m = 0;
    for (let soc = st.soc; soc < target; soc += 1) m += cap / 100 / Math.max(0.5, bandKw(Math.floor(soc / 5))) * 60;
    return Math.round(m);
  };
  const tgt = prefs.charge_target, mT = tgt ? minutesTo(tgt) : null, m100 = minutesTo(100);
  const home = prefs.home_lat !== null && st.lat && metres(st.lat, st.lon, prefs.home_lat, prefs.home_lon) <= prefs.home_radius_m;
  const price = home ? homePrice(st.charge_start || Date.now()) : prefs.public_price;
  const eta = (m) => m === null ? "--" : `${dur(m * 60000)}（${dt(Date.now() + m * 60000).slice(-5)}）`;
  return `<div class="card"><h2>⚡ 充電中</h2><div class="grid">
      <div class="stat"><b class="good">${fmt(kw, 1)} kW</b><span>${fast ? "快充" : "慢充"}</span></div>
      <div class="stat"><b>${fmt(st.charge_kwh, 1)} kWh</b><span>已充進</span></div>
      <div class="stat"><b>${st.charge_start ? dur(Date.now() - st.charge_start) : "--"}</b><span>充了多久</span></div>
      <div class="stat"><b>${fmt((st.charge_kwh || 0) * price)} 元</b><span>目前費用（${home ? "家・" + PERIOD_NAME[period(Date.now())] : "外面"}每度 ${price}）</span></div></div>
    ${tgt ? `<div class="row"><span>到 ${tgt}%</span><b>${eta(mT)}</b></div>` : ""}
    <div class="row"><span>到 100%</span><b>${eta(m100)}</b></div>
    <p class="dim">預估用這台車過去${fast ? "快充" : "慢充"}的曲線算${Object.keys(bands).length ? "" : "（還沒有紀錄，先用目前功率估）"}；電池約 ${fmt(cap)} kWh。到 ${tgt ?? "--"}% 會用 Telegram 通知（設定裡改）。</p></div>`;
}

async function renderReports() {
  const sec = "tab-reports";
  $(sec).innerHTML = `<div class="card dim">讀取中…</div>`;
  try {
    const since = Date.now() - 365 * 86400000;
    const trips = await all("trips", (r) => r.eq("open", false).gte("start_at", since).order("start_at"));
    const charges = await all("charges", (r) => r.eq("open", false).gte("start_at", Date.now() - 90 * 86400000).order("start_at"));
    const parks = await all("parks", (r) => r.gte("start_at", Date.now() - 90 * 86400000).order("start_at"));
    const places = await chargePlaces(charges.slice(-60));

    const sum = (from) => {
      const ts = trips.filter((t) => t.start_at >= from);
      const km = ts.reduce((a, t) => a + t.distance_m / 1000, 0), kwh = ts.reduce((a, t) => a + t.kwh_used - t.kwh_regen, 0);
      const cs = charges.filter((c) => c.start_at >= from);
      const cost = cs.reduce((a, c) => a + c.kwh_in * (places.get(`${c.device}/${c.car_id}`)?.price ?? prefs.public_price), 0);
      return { n: ts.length, km, kwh, whkm: km > 0 ? kwh * 1000 / km : null, cost, perKm: km > 0 ? cost / km : null };
    };
    const now = new Date(), week = new Date(now); week.setDate(now.getDate() - ((now.getDay() + 6) % 7)); week.setHours(0, 0, 0, 0);
    const month = new Date(now.getFullYear(), now.getMonth(), 1);
    const w = sum(week.getTime()), m = sum(month.getTime());
    const block = (title, s) => `<div class="card"><h2>${title}</h2><div class="grid">
      <div class="stat"><b>${fmt(s.km)} km</b><span>${s.n} 趟</span></div>
      <div class="stat"><b>${fmt(s.whkm)}</b><span>Wh/km</span></div>
      <div class="stat"><b>${fmt(s.cost)} 元</b><span>充電費用（約）</span></div>
      <div class="stat"><b>${fmt(s.perKm, 2)} 元</b><span>每公里</span></div></div></div>`;

    // parking drain per hour (only parks ≥ 1 h without charging)
    const pd = parks.filter((p) => p.soc_start !== null && p.soc_end !== null && p.end_at - p.start_at >= 3600000 && p.soc_start - p.soc_end >= 0)
      .map((p) => (p.soc_start - p.soc_end) / ((p.end_at - p.start_at) / 3600000));
    const pdAvg = pd.length ? pd.reduce((a, b) => a + b, 0) / pd.length : null;

    // battery health: usable capacity from charges that added ≥ 20 %
    const caps = charges.filter((c) => c.soc_end - c.soc_start >= 20).map((c) => ({ x: c.start_at, y: c.kwh_in / ((c.soc_end - c.soc_start) / 100) }));

    const scored = trips.slice(-30).map((t) => tripInfo(t).score).filter((s) => s !== null);

    // 每月充電：近 6 個月
    const months = [];
    for (let k = 5; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push([d.getTime(), new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(), `${d.getMonth() + 1} 月`]); }
    const allCharges = await all("charges", (r) => r.eq("open", false).gte("start_at", months[0][0]).order("start_at"));
    const mPlaces = await chargePlaces(allCharges.filter((c) => !places.has(`${c.device}/${c.car_id}`)));
    for (const [k, v] of places) mPlaces.set(k, v);
    const monthRows = months.map(([a, b, label]) => {
      const cs = allCharges.filter((c) => c.start_at >= a && c.start_at < b);
      const kwh = cs.reduce((x, c) => x + c.kwh_in, 0);
      const cost = cs.reduce((x, c) => x + c.kwh_in * (mPlaces.get(`${c.device}/${c.car_id}`)?.price ?? prefs.public_price), 0);
      const homeKwh = cs.filter((c) => mPlaces.get(`${c.device}/${c.car_id}`)?.home).reduce((x, c) => x + c.kwh_in, 0);
      const fastKwh = cs.filter((c) => c.max_kw >= 20).reduce((x, c) => x + c.kwh_in, 0);
      return { label, n: cs.length, kwh, cost, home: kwh ? homeKwh / kwh * 100 : null, fast: kwh ? fastKwh / kwh * 100 : null };
    });
    const monthTable = `<div class="card"><h2>每月充電</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums">
      <tr class="dim"><th align="left">月份</th><th align="right">次</th><th align="right">度</th><th align="right">元</th><th align="right">每度</th><th align="right">家充</th><th align="right">快充</th></tr>
      ${monthRows.map((m) => `<tr style="border-top:1px solid var(--line)"><td>${m.label}</td><td align="right">${m.n}</td><td align="right">${fmt(m.kwh)}</td><td align="right">${fmt(m.cost)}</td>
        <td align="right">${m.kwh ? fmt(m.cost / m.kwh, 1) : "--"}</td><td align="right">${m.home === null ? "--" : fmt(m.home) + "%"}</td><td align="right">${m.fast === null ? "--" : fmt(m.fast) + "%"}</td></tr>`).join("")}
      </table></div><p class="dim">家充／快充是占充電度數的比例。快充＝最高功率 20 kW 以上。</p></div>`;

    // 電池保養（近 90 天）
    const fastShare = charges.length ? charges.filter((c) => c.max_kw >= 20).length / charges.length * 100 : null;
    const highHours = parks.filter((p) => p.soc_start !== null && p.soc_start >= 90).reduce((x, p) => x + (p.end_at - p.start_at) / 3600000, 0);
    const lowCount = trips.filter((t) => t.start_at >= Date.now() - 90 * 86400000 && t.soc_end !== null && t.soc_end < 10).length
      + charges.filter((c) => c.soc_start !== null && c.soc_start < 10).length;
    const full = charges.filter((c) => c.soc_end >= 99).length;
    const care = (v, good, ok) => v === null ? "" : v <= good ? "good" : v <= ok ? "warn" : "bad";
    const careCard = `<div class="card"><h2>電池保養（近 90 天）</h2>
      <div class="row"><span>快充占充電次數</span><b class="${care(fastShare, 30, 60)}">${fastShare === null ? "--" : fmt(fastShare) + "%"}</b></div>
      <div class="row"><span>停在 90% 以上的時間</span><b class="${care(highHours, 48, 168)}">${fmt(highHours)} 小時</b></div>
      <div class="row"><span>充到 100% 的次數</span><b>${full}</b></div>
      <div class="row"><span>電量掉到 10% 以下</span><b class="${care(lowCount, 0, 3)}">${lowCount} 次</b></div>
      <p class="dim">一般建議：平常充到 80～90%，要遠行再充滿；充滿後不要放很久；少讓電量掉到 10% 以下；快充方便但不要天天用。顏色只是參考。</p></div>`;
    // reverse camera delay (牆泥 AA 助手 uploads each R as a note "倒車影像計時": ms=…, aa=1 when Android Auto was in front)

/**
 * 年度回顧 (owner 2026-11-25): this calendar year's trips, charges and GPS. Gas comparison uses a typical
 * petrol car (12 km/L, 95 at 30 元/L) and CO2 2.3 kg/L petrol vs 0.494 kg/kWh Taiwan grid (energy-board factor);
 * all rough, said on the page.
 */
async function yearReview() {
  const box = $("yearBox");
  box.innerHTML = `<p class="dim">整理中…</p>`;
  try {
    const y = new Date().getFullYear(), from = new Date(y, 0, 1).getTime();
    const trips = await all("trips", (r) => r.eq("open", false).gte("start_at", from).order("start_at"));
    if (!trips.length) { box.innerHTML = `<p class="dim">今年還沒有旅程紀錄。</p>`; return; }
    const charges = await all("charges", (r) => r.eq("open", false).gte("start_at", from).order("start_at"));
    const places = await chargePlaces(charges);
    const km = trips.reduce((a, t) => a + t.distance_m / 1000, 0);
    const hours = trips.reduce((a, t) => a + t.moving_s / 3600, 0);
    const kwh = charges.reduce((a, c) => a + c.kwh_in, 0);
    const cost = charges.reduce((a, c) => a + c.kwh_in * (places.get(`${c.device}/${c.car_id}`)?.price ?? prefs.public_price), 0);
    const gasL = km / 12, gasCost = gasL * 30;
    const co2 = gasL * 2.3 - kwh * 0.494;
    const longest = trips.reduce((a, t) => (t.distance_m > a.distance_m ? t : a));
    // most efficient: battery % per 100 km on trips of 10 km or more (works without power data)
    const eff = trips.filter((t) => t.distance_m >= 10000 && t.soc_start !== null && t.soc_end !== null && t.soc_start > t.soc_end)
      .map((t) => ({ t, r: (t.soc_start - t.soc_end) / (t.distance_m / 1000) * 100 })).sort((a, b) => a.r - b.r);
    // months
    const months = Array.from({ length: 12 }, () => 0);
    for (const t of trips) months[new Date(t.start_at).getMonth()] += t.distance_m / 1000;
    const maxM = Math.max(...months, 1);
    // where the car stops most: the last GPS point of each trip, rounded to ~100 m
    const pts = await all("points", (r) => r.gte("t", from).order("t"), "lat,lon,trip_id,device,t", 100000);
    const lastOf = new Map();
    for (const p of pts) lastOf.set(p.device + "/" + p.trip_id, p);
    const spots = new Map();
    for (const p of lastOf.values()) {
      const k = `${p.lat.toFixed(3)},${p.lon.toFixed(3)}`;
      spots.set(k, (spots.get(k) ?? 0) + 1);
    }
    const top = [...spots.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
    const home = prefs.home_lat !== null ? (k) => { const [a, b] = k.split(",").map(Number); return metres(a, b, prefs.home_lat, prefs.home_lon) < 300; } : () => false;
    box.innerHTML = `
      <div class="grid" style="margin-top:10px">
        <div class="stat"><b>${fmt(km)} km</b><span>${trips.length} 趟、開了 ${fmt(hours)} 小時</span></div>
        <div class="stat"><b>${fmt(kwh)} 度</b><span>${charges.length} 次充電、約 ${fmt(cost)} 元</span></div>
        <div class="stat"><b class="good">${fmt(gasCost - cost)} 元</b><span>比開油車省（油車約 ${fmt(gasCost)} 元）</span></div>
        <div class="stat"><b class="good">${fmt(co2)} kg</b><span>少排的二氧化碳</span></div>
      </div>
      <div class="row"><span>最長的一趟</span><b>${dt(longest.start_at)}　${fmt(longest.distance_m / 1000, 1)} km</b></div>
      ${eff.length ? `<div class="row"><span>最省電的一趟</span><b>${dt(eff[0].t.start_at)}　每百公里 ${fmt(eff[0].r, 1)}%</b></div>` : ""}
      <h3 style="margin:12px 0 4px;font-size:15px">每個月開了多遠</h3>
      <div style="display:flex;gap:4px;align-items:flex-end;height:90px">${months.map((v, i) =>
        `<div style="flex:1;text-align:center;font-size:11px" class="dim"><div style="height:${Math.round(v / maxM * 70)}px;background:var(--accent);border-radius:3px 3px 0 0"></div>${i + 1}</div>`).join("")}</div>
      <h3 style="margin:12px 0 4px;font-size:15px">最常停的地方</h3>
      ${top.length ? top.map(([k, n], i) => `<div class="row"><span>${i + 1}. ${home(k) ? "🏠 家" : `<a href="https://maps.google.com/?q=${k}">${k}</a>`}</span><b>${n} 次</b></div>`).join("") : `<p class="dim">沒有 GPS 紀錄。</p>`}
      <p class="dim">油車用每公升 12 km、95 無鉛 30 元估；電的碳排用台灣電力排碳係數 0.494 kg/度。都是粗估。</p>`;
  } catch (e) { box.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}

async function lifetimeMap() {
  const el = $("lifeMap");
  el.classList.remove("hidden");
  el.innerHTML = `<p class="dim" style="padding:12px">讀取中…</p>`;
  try {
    const pts = await all("points", (r) => r.gte("t", Date.now() - 365 * 86400000).order("t"), "lat,lon,trip_id,device", 100000);
    el.innerHTML = "";
    if (!pts.length) { el.innerHTML = `<p class="dim" style="padding:12px">沒有 GPS 點。</p>`; return; }
    const m = mapIn(el, pts[0].lat, pts[0].lon, 11);
    const groups = new Map();
    for (const p of pts) { const k = p.device + "/" + p.trip_id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push([p.lat, p.lon]); }
    const all_ = [];
    for (const g of groups.values()) { L.polyline(g, { color: "#dc2626", weight: 3, opacity: .45 }).addTo(m); all_.push(...g); }
    m.fitBounds(L.latLngBounds(all_), { padding: [20, 20] });
  } catch (e) { el.innerHTML = `<p class="bad" style="padding:12px">${esc(e.message)}</p>`; }
}

const BOX = {
  SVC: "6e400001-b5a3-f393-e0a9-e50e24dcca9f",
  RX: "6e400002-b5a3-f393-e0a9-e50e24dcca9f",   // write
  TX: "6e400003-b5a3-f393-e0a9-e50e24dcca9f",   // notify
  LOCK: Uint8Array.of(0x01, 0x01, 0x02, 0x22, 0x00),
  UNLOCK: Uint8Array.of(0x01, 0x01, 0x02, 0x22, 0x01),
};
let keyBusy = false;

function keyCode() { try { return localStorage.getItem("qnBoxCode") || ""; } catch { return ""; } }
function keyHexToBytes(s) {
  s = s.replace(/[\s:]/g, "").toLowerCase();
  if (s.length % 2 || s.length < 20 || s.length > 128 || /[^0-9a-f]/.test(s)) return null;
  const a = new Uint8Array(s.length / 2);
  for (let i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
  return a;
}
function keyToHex(dv) { let s = ""; for (let i = 0; i < dv.byteLength; i++) s += dv.getUint8(i).toString(16).padStart(2, "0"); return s; }
function keyStatus(msg, cls) { const e = $("keyStatus"); if (e) { e.textContent = msg; e.className = "dim " + (cls || ""); } }

function renderKey() {
  const p = keyCode();
  $("tab-key").innerHTML = `
    <div style="display:flex;gap:14px;margin:6px 0 10px">
      <button id="kUnlock" style="flex:1;font-size:28px;font-weight:700;padding:30px 0;border:0;border-radius:18px;color:#fff;background:#1f7a3d">解鎖</button>
      <button id="kLock" style="flex:1;font-size:28px;font-weight:700;padding:30px 0;border:0;border-radius:18px;color:#fff;background:#8a2b2b">上鎖</button>
    </div>
    <div id="keyStatus" class="dim" style="min-height:24px;font-size:17px;margin:6px 2px">${p ? "準備好了" : "先在下面設定登入碼"}</div>
    <div class="card"><h2>怎麼用</h2>
      <p class="dim">用藍牙直接開/鎖你的鑰匙盒（手動一鍵，不是人到自動開）。<b>iPhone 要用 Bluefy 瀏覽器開這一頁</b>（Safari 不支援網頁藍牙）；安卓用 Chrome。第一次會跳裝置選單，選到 BL 開頭的盒子。車機正在連盒子時先別同時用，會互搶。</p>
    </div>
    <div class="card"><h2>登入碼（只存這支手機，不上傳）</h2>
      <p class="dim">跟你在車上「牆泥鑰匙」輸入的同一組，十六進位、可有空白。</p>
      <input id="kCode" type="text" inputmode="latin" autocomplete="off" placeholder="例如 01011144a0dd…" value="${esc(p)}" style="width:100%;padding:12px;border-radius:10px;margin:4px 0 10px">
      <div style="display:flex;gap:10px">
        <button id="kSave" class="ghost" style="flex:1">儲存登入碼</button>
        <button id="kForget" class="ghost" style="flex:1">清除</button>
      </div>
    </div>`;
  $("kSave").onclick = () => {
    const b = keyHexToBytes($("kCode").value);
    if (!b) { keyStatus("登入碼格式不對（十六進位、10–64 位元組）", "bad"); return; }
    try { localStorage.setItem("qnBoxCode", $("kCode").value.replace(/[\s:]/g, "").toLowerCase()); } catch {}
    keyStatus("登入碼已存在這支手機", "good");
  };
  $("kForget").onclick = () => { try { localStorage.removeItem("qnBoxCode"); } catch {}; $("kCode").value = ""; keyStatus("已清除登入碼", ""); };
  $("kUnlock").onclick = () => runKey("unlock");
  $("kLock").onclick = () => runKey("lock");
}

async function runKey(want) {
  if (keyBusy) return;
  if (!navigator.bluetooth) { keyStatus("這個瀏覽器不支援網頁藍牙。iPhone 用 Bluefy、安卓用 Chrome。", "bad"); return; }
  const codeBytes = keyHexToBytes(keyCode());
  if (!codeBytes) { keyStatus("先設定登入碼", "bad"); return; }
  keyBusy = true; $("kUnlock").disabled = $("kLock").disabled = true;
  const label = want === "unlock" ? "解鎖" : "上鎖";
  let gatt = null, done = false, cmdSent = false;
  const finish = (ok, msg) => {
    if (done) return; done = true;
    keyStatus((ok ? "✓ " : "✗ ") + msg, ok ? "good" : "bad");
    try { gatt && gatt.disconnect(); } catch {}
    keyBusy = false; const u = $("kUnlock"), l = $("kLock"); if (u) u.disabled = false; if (l) l.disabled = false;
  };
  try {
    keyStatus("選擇你的盒子…");
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "BL" }, { services: [BOX.SVC] }], optionalServices: [BOX.SVC] });
    keyStatus("連線中…");
    gatt = await dev.gatt.connect();
    const svc = await gatt.getPrimaryService(BOX.SVC);
    const rx = await svc.getCharacteristic(BOX.RX);
    const tx = await svc.getCharacteristic(BOX.TX);
    const sendCmd = async () => { if (cmdSent) return; cmdSent = true; keyStatus("送" + label + "…"); await rx.writeValueWithoutResponse(want === "unlock" ? BOX.UNLOCK : BOX.LOCK); };
    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged", (e) => {
      const h = keyToHex(e.target.value);
      if (h.startsWith("010102f044")) { sendCmd(); return; }
      const i = h.indexOf("f026");
      if (i >= 0 && i % 2 === 0) {
        const st = h.substr(i + 4, 2);
        if (want === "unlock" && st === "01") finish(true, "盒子回報：已打開");
        else if (want === "lock" && st === "00") finish(true, "盒子回報：已上鎖");
      }
    });
    keyStatus("登入…");
    await rx.writeValueWithoutResponse(codeBytes);
    setTimeout(() => { if (!done && !cmdSent) sendCmd(); }, 1200);
    setTimeout(() => finish(false, "盒子 15 秒內沒回報（不在附近、沒電，或被車機佔住連線）"), 15000);
  } catch (err) { finish(false, (err && err.message) ? err.message : "連不上"); }
}

  accel: ["油門", "18", "%"], speed: ["車速", "98", "km/h"], arrive: ["到達剩", "38", "%"], nextCam: ["下個測速", "2.3", "km 限70"],
  cms: ["前方塞車", "2.1 km", "車速23"], today: ["今天", "46", "km 用9%"], avgSpeed: ["平均", "54", "km/h"], chargeLeft: ["充飽還要", "1:20", "18:40滿"],
  month: ["本月充電", "212", "度 424元"], tireTemp: ["胎溫", "33·33·34·33", "°C"], lvRest: ["小電瓶", "12.58", "V 正常"],
  clock: ["時間", "14:22", ""], date: ["日期", "11/19", "週三"],
  jam: ["前方塞車", "2.1 km", "車速23"], parking: ["青年路", "105", "位 0.6km"],
};
const CL_DEF_RIGHT = { drive: [], park: ["battery", "range", "sinceCharge", "odo", "weather"] };

function clPreview(layout, mode) {
  const rowHtml = (id, small) => {
    const [l, v, u] = CL_SAMPLE[id] || [CL_NAME[id] || id, "--", ""];
    return small ? `<div class="pvcol"><span class="pvl">${l}</span><span><b class="pvv">${v}</b> <span class="pvu">${u}</span></span></div>`
      : `<div class="pvrow"><span class="pvl">${l}</span><span><b class="pvv">${v}</b> <span class="pvu">${u}</span></span></div>`;
  };
  const isDef = (card) => !((layout[card] || {})[mode] || []).length;
  const pick = (card) => { const l = (layout[card] || {})[mode] || []; return l.length ? l : (card === "right" ? CL_DEF_RIGHT[mode] : CL_DEFAULT[card][mode]); };
  const tag = (card) => isDef(card) ? `<span class="pvdef">預設</span>` : "";
  const nav = `<div class="pvnav"><div class="pvarrow">↱</div><div><b class="pvdist">1.2 公里</b><div class="pvins">往 仁德系統 / 國道1號</div></div></div>
      <div class="pvleft">23 分鐘・28 公里・12:38 到</div><div class="pvbar"><i></i></div>`;
  const right = mode === "drive" && !(layout.right && layout.right.drive && layout.right.drive.length) ? nav
    : pick("right").map((id) => rowHtml(id)).join("");
  return `<div class="pv">
    <div class="pvmid"><div class="pvspeed">${mode === "drive" ? "98" : "0"}<small> km/h</small></div><div class="pvready">READY</div><div class="pvlane"></div><div class="pvnote">原廠車速・輔助駕駛（不蓋）</div></div>
    ${layout.on.left ? `<div class="pvcard pvL"><div class="pvhead"><span class="pvtitle">車況 ${tag("left")}</span><span class="pvgear">${mode === "drive" ? "D" : "P"}</span></div>${pick("left").map((id) => rowHtml(id)).join("")}</div>` : ""}
    ${layout.on.top ? `<div class="pvcard pvT">${pick("top").slice(0, 2).map((id) => rowHtml(id, true)).join("")}</div>` : ""}
    <div class="pvcard pvR">${right}${mode === "park" || (layout.right && layout.right.drive && layout.right.drive.length) ? tag("right") : ""}</div>
  </div>`;
}

function renderCluster() {
  document.querySelector("main").classList.add("wide");
  const L = JSON.parse(JSON.stringify(prefs.cluster_layout || CL_DEFAULT));
  for (const k of ["right", "left", "top"]) L[k] = Object.assign({ drive: [], park: [] }, L[k] || {});
  L.on = Object.assign({ left: true, top: true }, L.on || {});
  const chip = (id) => `<span class="clchip" data-id="${id}">${CL_NAME[id] || id}<b class="clx" aria-label="移除">✕</b></span>`;
  $("tab-cluster").innerHTML = `<div class="clgrid"><div class="clpv">
    <div class="card"><h2>模擬圖</h2>
      <div class="row" style="gap:8px;justify-content:flex-start"><button id="pvDrive" class="pvtab">開車時</button><button id="pvPark" class="pvtab pvoff">停車</button></div>
      <div id="clPreview" style="margin-top:8px"></div><p class="dim" style="font-size:13px">數字是範例。導航中右卡整張是導航；有測速、超速時三張一起閃紅；上方細條遇到服務區、快充、警示會自動換掉。</p></div>
    </div><div class="clctl">
    <div class="card"><h2>儀表卡排版</h2>
      <p class="dim">把下面的項目<b>拖</b>到想放的卡片，卡片裡也可以拖來排順序；按 ✕ 拿掉。存檔後約 2 分鐘車上會自動套用（車子要開著、有網路）。空的那張會用預設內容。</p>
      <label class="row"><span>左卡（車況）</span><input type="checkbox" id="clLeft" ${L.on.left ? "checked" : ""} style="width:auto"></label>
      <label class="row"><span>上方細條（車速上面）</span><input type="checkbox" id="clTop" ${L.on.top ? "checked" : ""} style="width:auto"></label>
    </div>
    <div class="card clpal"><h2>可以放的項目</h2><div id="clPalette" class="clbox">${CL_ITEMS.map(([id]) => chip(id)).join("")}</div></div>
    ${CL_LISTS.map(([c, m, t, max]) => `<div class="card"><h2 style="font-size:16px">${t}</h2>
      <div class="clbox cllist" data-card="${c}" data-mode="${m}" data-max="${max}">${L[c][m].map(chip).join("")}</div></div>`).join("")}
    <div class="card"><button id="clSave">存檔，傳到車上</button> <button id="clReset" class="secondary">全部恢復預設</button>
      <p id="clMsg" class="dim"></p></div>
    </div></div>`;
  let pvMode = "drive";
  const redraw = () => {
    $("clPreview").innerHTML = clPreview(collect(), pvMode);
    $("pvDrive").classList.toggle("pvoff", pvMode !== "drive"); $("pvPark").classList.toggle("pvoff", pvMode !== "park");
  };
  $("pvDrive").onclick = () => { pvMode = "drive"; redraw(); };
  $("pvPark").onclick = () => { pvMode = "park"; redraw(); };
  $("clLeft").onchange = redraw; $("clTop").onchange = redraw;
  new Sortable($("clPalette"), { group: { name: "cl", pull: "clone", put: false }, sort: false, animation: 120 });
  document.querySelectorAll(".cllist").forEach((el) => new Sortable(el, {
    group: { name: "cl", pull: true, put: (to) => to.el.children.length < +to.el.dataset.max }, animation: 120,
    onAdd: (e) => { // no duplicate in one list
      const ids = [...el.children].map((c) => c.dataset.id);
      if (ids.filter((x) => x === e.item.dataset.id).length > 1) e.item.remove();
      redraw();
    },
    onSort: () => redraw(), onRemove: () => redraw(),
  }));
  $("tab-cluster").addEventListener("click", (e) => { if (e.target.classList.contains("clx") && e.target.closest(".cllist")) { e.target.parentElement.remove(); redraw(); } });
  const collect = () => {
    const out = { right: {}, left: {}, top: {}, on: { left: $("clLeft").checked, top: $("clTop").checked } };
    document.querySelectorAll(".cllist").forEach((el) => { out[el.dataset.card][el.dataset.mode] = [...el.children].map((c) => c.dataset.id); });
    return out;
  };
  const save = async (layout) => {
    $("clMsg").textContent = "存檔中…";
    const { error } = await sb.from("prefs").upsert({ cluster_layout: layout }, { onConflict: "user_id" });
    if (error) { $("clMsg").textContent = "存檔失敗：" + error.message; return; }
    prefs.cluster_layout = layout;
    $("clMsg").textContent = "已存檔 ✓ 車上約 2 分鐘內會套用";
  };
  $("clSave").onclick = () => save(collect());
  const watch = new MutationObserver(() => redraw());
  document.querySelectorAll(".cllist").forEach((el) => watch.observe(el, { childList: true }));
  redraw();
  $("clReset").onclick = async () => { await save(CL_DEFAULT); renderCluster(); };
}

function renderSettings() {
  const p = prefs;
  $("tab-settings").innerHTML = `<div class="card"><h2>電價</h2>
      <label>家充每度（元；累進電價填平均每度，時間電價會用台電費率表）</label><input id="pHome" type="number" step="0.01" value="${p.home_price}">
      <label>外面充電每度（元）</label><input id="pPublic" type="number" step="0.01" value="${p.public_price}">
    </div>
    <div class="card"><h2>充電通知</h2>
      <label>充到幾 % 用 Telegram 通知（空白＝不通知）</label><input id="pTarget" type="number" min="20" max="100" value="${p.charge_target ?? ""}">
    </div>
    <div class="card"><h2>家裡的電價</h2>
      <p class="dim">看電費單上的「電價種類」。選了時間電價後，家充費用會照尖峰／離峰分開算，尖峰時段在家開始充電，車子也會提醒你等離峰。</p>
      <select id="pPlan" style="width:100%;padding:10px;border-radius:10px;margin:4px 0 10px">
        ${[["none", "累進電價（一般住家，沒有尖峰離峰）"], ["simple2", "簡易型時間電價：二段式"], ["simple3", "簡易型時間電價：三段式"], ["custom", "其他（自己填離峰時段）"]]
          .map(([v, n]) => `<option value="${v}" ${p.tou_plan === v ? "selected" : ""}>${n}</option>`).join("")}
      </select>
      ${TOU[p.tou_plan] ? `<div class="dim">${(() => { const t = TOU[p.tou_plan], f2 = (o) => Object.entries(o).map(([k, v]) => `${PERIOD_NAME[k]} ${v}`).join("、");
        return `夏月（6/1～9/30）：${f2(t.summer)} 元<br>非夏月：${f2(t.winter)} 元<br>${p.tou_plan === "simple2"
          ? "夏月平日 00:00–09:00 離峰，其他尖峰；非夏月平日 00:00–06:00、11:00–14:00 離峰，其他尖峰。"
          : "夏月平日 00:00–09:00 離峰、16:00–22:00 尖峰、其他半尖峰；非夏月平日 00:00–06:00、11:00–14:00 離峰，其他半尖峰。"}週六日全天離峰。<br>台電 2025/10/1 起的費率（每月基本電費 75 元、超過 2000 度另加 1.04 元/度沒算進去）。國定假日台電也算離峰，這裡沒算。數字跟電費單不同請告訴我。`; })()}</div>` : ""}
      <div id="customTou" class="${p.tou_plan === "custom" ? "" : "hidden"}">
        <label>離峰開始（例如 22:30）</label><input id="pOffStart" value="${esc(p.offpeak_start ?? "")}">
        <label>離峰結束（例如 07:30）</label><input id="pOffEnd" value="${esc(p.offpeak_end ?? "")}">
        <label><input id="pWeekend" type="checkbox" style="width:auto" ${p.weekend_offpeak ? "checked" : ""}> 週六日全天離峰</label>
        <label>尖峰每度（元）</label><input id="pPeak" type="number" step="0.01" value="${p.home_peak_price}">
      </div>
    </div>
    <div class="card"><h2>家的位置</h2>
      <p class="dim">在家附近充電就算家充。人在家時按「用現在位置」。</p>
      <p>${p.home_lat !== null ? `目前：${fmt(p.home_lat, 4)}, ${fmt(p.home_lon, 4)}` : "還沒設定"}</p>
      <button class="ghost" onclick="useHere()">用現在位置</button>
      <label>半徑（公尺）</label><input id="pRadius" type="number" value="${p.home_radius_m}">
    </div>
    <div class="card"><h2>保養提醒</h2>
      <p class="dim">設了之後，儀表卡會顯示「離下次保養還有幾 km」，到期前 500 km 也會用 Telegram 提醒一次。用的是車機的真實總里程（要裝「牆泥車況讀取」才有）。保養週期填 0＝關閉。</p>
      <label>每幾 km 保養一次（例如 10000；0＝關閉）</label><input id="pSvcEvery" type="number" min="0" value="${p.service_every_km ?? 0}">
      <label>上次保養時的總里程（km）</label><input id="pSvcBase" type="number" step="1" value="${p.service_base_km ?? ""}">
    </div>
    <p><button onclick="savePrefs()">儲存</button> <span id="prefMsg"></span></p>
    <div class="card"><h2>iPhone 小工具</h2><p><a href="iphone.html">安裝說明＋一鍵複製程式</a></p></div>
    <div class="card"><h2>帳號</h2><button class="ghost" onclick="logout()">登出</button></div>
    <details><summary>關於</summary><p class="dim">資料來源：車上的牆泥行車紀錄，每分鐘上傳一次（斷網會補傳）。里程是用車速算的，和儀表會有一點差距。</p></details>`;
}
document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "pPlan") { prefs.tou_plan = e.target.value; renderSettings(); }
});
function useHere() {
  navigator.geolocation.getCurrentPosition((pos) => { prefs.home_lat = pos.coords.latitude; prefs.home_lon = pos.coords.longitude; renderSettings(); },
    (e) => alert("拿不到位置：" + e.message), { enableHighAccuracy: true, timeout: 15000 });
}
async function savePrefs() {
  prefs.home_price = Number($("pHome").value); prefs.public_price = Number($("pPublic").value); prefs.home_radius_m = Number($("pRadius").value);
  const t = $("pTarget").value.trim();
  prefs.charge_target = t === "" ? null : Math.max(20, Math.min(100, Math.round(Number(t))));
  prefs.tou_plan = $("pPlan").value; prefs.tou_enabled = prefs.tou_plan !== "none";
  prefs.weekend_offpeak = $("pWeekend").checked; prefs.home_peak_price = Number($("pPeak").value);
  prefs.offpeak_start = $("pOffStart").value.trim(); prefs.offpeak_end = $("pOffEnd").value.trim();
  const svcEvery = Math.max(0, Math.round(Number($("pSvcEvery").value) || 0));
  const svcBaseRaw = $("pSvcBase").value.trim();
  prefs.service_every_km = svcEvery; prefs.service_base_km = svcBaseRaw === "" ? null : Number(svcBaseRaw);
  if (prefs.tou_plan === "custom" && (hm(prefs.offpeak_start) === null || hm(prefs.offpeak_end) === null)) { $("prefMsg").textContent = "離峰時間要寫成 22:30 這樣"; return; }
  const { error } = await sb.from("prefs").upsert({ home_price: prefs.home_price, public_price: prefs.public_price,
    home_lat: prefs.home_lat, home_lon: prefs.home_lon, home_radius_m: prefs.home_radius_m, charge_target: prefs.charge_target,
    tou_enabled: prefs.tou_enabled, tou_plan: prefs.tou_plan, offpeak_start: prefs.offpeak_start, offpeak_end: prefs.offpeak_end,
    weekend_offpeak: prefs.weekend_offpeak, home_peak_price: prefs.home_peak_price,
    service_every_km: prefs.service_every_km, service_base_km: prefs.service_base_km }, { onConflict: "user_id" });
  $("prefMsg").textContent = error ? "儲存失敗：" + error.message : "已儲存";
}
async function logout() { await sb.auth.signOut(); location.reload(); }

boot();
</script>
</body>
</html>
